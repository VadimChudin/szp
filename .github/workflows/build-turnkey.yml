name: Build Turnkey Installer

# Turnkey-конвейер: сам компилирует MT5-компоненты (.ex5) из свежих исходников,
# собирает десктоп-приложение (PyInstaller) и финальный установщик (Inno Setup),
# и публикует SmartZonesPro_Setup.exe как артефакт (а по тегу v* — в Releases).
#
# Клиенту достаточно ссылки на скачивание .exe — ручная компиляция в MetaEditor
# больше не нужна.

on:
  push:
    branches: [ 'devin/**', 'experiment/**' ]
    tags: [ 'v*', 'exp-v*' ]
  workflow_dispatch:

permissions:
  contents: write   # нужно для публикации Release по тегу

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # requirements.txt — единственный источник зависимостей. Раньше pystray и
      # Pillow ставились здесь руками, поэтому их отсутствие в requirements.txt
      # никто не замечал, а локальная установка по файлу давала ImportError.
      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r python_core/requirements.txt
          python -m pip install pytest ruff

      # Блокирующая проверка: ruff --select F ловит неопределённые имена (F821)
      # и затенение импортов (F823). Именно такие баги жили в bridge_server и
      # dukascopy_loader и молча ломали слой ИИ и кэш тиков.
      # Набор F,E9 на момент включения проходит без замечаний — держим его
      # чистым, чтобы новые F821/F823 нельзя было внести незаметно.
      - name: Lint (ruff, критичные правила)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ruff check python_core --select F,E9

      - name: Run Python tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest -q python_core/tests

      # ── 0. Канал и номер сборки → приложение, индикаторы, установщик ──
      # Stable и Experimental используют один Output/, но разные AppId,
      # каталоги установки, имена файлов и GitHub Actions artifacts.
      - name: Stamp channel and build version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isExperimentalTag = $env:GITHUB_REF_NAME -like 'exp-v*'
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and -not $isExperimentalTag) {
            $channel = 'Stable'
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ($isExperimentalTag) {
            $channel = 'Experimental'
            $ver = $env:GITHUB_REF_NAME -replace '^exp-v', ''
          } else {
            $channel = 'Experimental'
            $ver = '0.0.0.' + $env:GITHUB_RUN_NUMBER
          }
          $buildLabel = "$channel-$ver-$($env:GITHUB_SHA.Substring(0, 7))"
          $artifactName = "SmartZonesPro_Setup_${channel}_${ver}_${env:GITHUB_RUN_NUMBER}"
          Write-Host "Build channel: $channel"
          Write-Host "Build version: $ver"
          "APP_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path 'python_core\build_version.txt' -Value $buildLabel -Encoding utf8 -NoNewline
          Get-ChildItem -Path mql -Recurse -Include *.mq4, *.mq5 | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            if ($text -match '#define SZP_BUILD "dev"') {
              $text.Replace('#define SZP_BUILD "dev"', "#define SZP_BUILD `"$buildLabel`"") |
                Set-Content $_.FullName -Encoding utf8 -NoNewline
              Write-Host "Stamped $($_.Name)"
            }
          }

      # ── 1. MetaEditor (ставится вместе с MetaTrader 5) ──────────────────
      - name: Install MetaTrader 5 (provides MetaEditor)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Write-Host "Downloading MT5 setup from $url"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Write-Host "Running silent install (/auto)…"
          Start-Process -FilePath $installer -ArgumentList '/auto' -Wait
          # MetaEditor может ставиться асинхронно — подождём появления файла.
          $me = $null
          foreach ($i in 1..30) {
            $me = Get-ChildItem 'C:\Program Files' -Recurse -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
            if ($me) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $me) {
            Write-Error 'metaeditor64.exe not found after MT5 install'
            exit 1
          }
          Write-Host "MetaEditor: $($me.FullName)"
          "METAEDITOR=$($me.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ── 2. Компиляция MT5 (.mq5 → .ex5) ─────────────────────────────────
      - name: Compile MQL5 components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'mql\MT5\Indicators\StrongZones.mq5',
            'mql\MT5\Experts\SmartZonesCollector.mq5'
          )
          $failed = $false
          foreach ($rel in $files) {
            $src = Join-Path $PWD $rel
            $ex  = [System.IO.Path]::ChangeExtension($src, 'ex5')
            $log = "$src.log"
            # Удаляем старый бинарник, чтобы «файл существует» = свежая сборка.
            if (Test-Path $ex)  { Remove-Item $ex  -Force }
            if (Test-Path $log) { Remove-Item $log -Force }
            Write-Host "::group::Compiling $rel"
            Start-Process -FilePath $env:METAEDITOR `
              -ArgumentList "/compile:`"$src`"", "/log:`"$log`"" -Wait
            if (Test-Path $log) {
              # Лог MetaEditor в UTF-16.
              Get-Content -Path $log -Encoding Unicode | ForEach-Object { Write-Host $_ }
            }
            Write-Host "::endgroup::"
            if (-not (Test-Path $ex)) {
              Write-Error "Compilation FAILED: $ex was not produced"
              $failed = $true
            } else {
              Write-Host "OK: $ex ($((Get-Item $ex).Length) bytes)"
            }
          }
          if ($failed) { exit 1 }

      # ── 2b. MetaTrader 4 (свой MetaEditor) ──────────────────────────────
      - name: Install MetaTrader 4 (provides MT4 MetaEditor)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'mt4setup.exe'
          Write-Host "Downloading MT4 setup from $url"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Write-Host "Running silent install (/auto)…"
          Start-Process -FilePath $installer -ArgumentList '/auto' -Wait
          # MT4-редактор называется metaeditor.exe (32-бит), появляется асинхронно.
          $me = $null
          foreach ($i in 1..30) {
            $me = Get-ChildItem 'C:\Program Files (x86)','C:\Program Files' -Recurse -Filter 'metaeditor.exe' -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notmatch 'MetaTrader 5' } |
                  Select-Object -First 1
            if ($me) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $me) {
            Write-Error 'MT4 metaeditor.exe not found after MT4 install'
            exit 1
          }
          Write-Host "MT4 MetaEditor: $($me.FullName)"
          "METAEDITOR4=$($me.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ── 2c. Компиляция MT4 (.mq4 → .ex4) ────────────────────────────────
      - name: Compile MQL4 components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'mql\MT4\Indicators\StrongZones.mq4',
            'mql\MT4\Experts\SmartZonesCollector.mq4'
          )
          $failed = $false
          foreach ($rel in $files) {
            $src = Join-Path $PWD $rel
            $ex  = [System.IO.Path]::ChangeExtension($src, 'ex4')
            $log = "$src.log"
            if (Test-Path $ex)  { Remove-Item $ex  -Force }
            if (Test-Path $log) { Remove-Item $log -Force }
            Write-Host "::group::Compiling $rel"
            Start-Process -FilePath $env:METAEDITOR4 `
              -ArgumentList "/compile:`"$src`"", "/log:`"$log`"" -Wait
            if (Test-Path $log) {
              Get-Content -Path $log -Encoding Unicode | ForEach-Object { Write-Host $_ }
            }
            Write-Host "::endgroup::"
            if (-not (Test-Path $ex)) {
              Write-Error "Compilation FAILED: $ex was not produced"
              $failed = $true
            } else {
              Write-Host "OK: $ex ($((Get-Item $ex).Length) bytes)"
            }
          }
          if ($failed) { exit 1 }

      - name: Upload compiled MT4/MT5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mql-compiled-${{ env.APP_CHANNEL }}-${{ github.run_number }}
          path: |
            mql/MT5/Indicators/StrongZones.ex5
            mql/MT5/Experts/SmartZonesCollector.ex5
            mql/MT4/Indicators/StrongZones.ex4
            mql/MT4/Experts/SmartZonesCollector.ex4
          if-no-files-found: error

      # ── 3. Сборка приложения (PyInstaller) ──────────────────────────────
      - name: Download llama.cpp server (Vulkan)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Vulkan-сборка выбрана осознанно: один набор файлов работает на
          # NVIDIA, AMD и Intel и умеет падать на процессор. CUDA-вариант
          # быстрее на NVIDIA, но требует ещё ~400 МБ cudart и не работает у
          # остальных. Клиенту ничего доустанавливать не нужно.
          # Версия закреплена: обновлять сознательно, а не «как повезёт».
          $build = 'b10786'
          $zip = "llama-$build-bin-win-vulkan-x64.zip"
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/$build/$zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath 'llama_tmp' -Force

          $dest = 'python_core\llama'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $server = Get-ChildItem -Path 'llama_tmp' -Recurse -Filter 'llama-server.exe' |
                    Select-Object -First 1
          if (-not $server) { throw "llama-server.exe не найден в архиве $zip" }
          Copy-Item $server.FullName -Destination $dest -Force
          # Рядом с сервером нужны его .dll, иначе он не стартует.
          Get-ChildItem -Path $server.Directory -Filter '*.dll' |
            Copy-Item -Destination $dest -Force

          $mb = [math]::Round((Get-ChildItem $dest -Recurse |
                Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "llama-server готов: $mb MB в $dest"

      - name: Install Python build deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python_core/requirements.txt
          python -m pip install pyinstaller

      - name: Build SmartZonesPro.exe (PyInstaller)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $PWD
          if (-not (Test-Path 'python_core\brokers.json')) {
            '{"active_broker": 0, "brokers": [{"name": "Broker 1", "server": "", "login": 0, "password": "", "path": ""}, {"name": "Broker 2", "server": "", "login": 0, "password": "", "path": ""}, {"name": "Broker 3", "server": "", "login": 0, "password": "", "path": ""}]}' |
              Out-File -FilePath 'python_core\brokers.json' -Encoding ascii
          }
          # Исключаем simplejson: при частичной упаковке requests падает на
          # "cannot import name 'JSONDecodeError' from 'simplejson'". Без него
          # requests использует стандартный json и работает на любом ПК.
          python -m PyInstaller --noconfirm --onedir --windowed --name "SmartZonesPro" `
            --distpath "$repo\dist" --workpath "$repo\build" --specpath "$repo" `
            --exclude-module simplejson `
            --hidden-import settings_window `
            --hidden-import ui_theme `
            --hidden-import pystray `
            --hidden-import PIL `
            --add-data "$repo\python_core\brokers.json;." `
            --add-data "$repo\python_core\build_version.txt;." `
            --add-data "$repo\data_bridge\footprint_1h.html;data_bridge" `
            --add-data "$repo\data_bridge\footprint_4h.html;data_bridge" `
            --add-data "$repo\data_bridge\footprint_1d.html;data_bridge" `
            "$repo\python_core\app_entry.py"
          if (-not (Test-Path "$repo\dist\SmartZonesPro\SmartZonesPro.exe")) {
            Write-Error 'PyInstaller output missing'
            exit 1
          }

      # ── 4. Финальный установщик (Inno Setup) ────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (ISCC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem 'C:\Program Files (x86)','C:\Program Files' -Recurse -Filter 'ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName } else { Write-Error 'ISCC.exe not found'; exit 1 }
          }
          & $iscc "/DAppVer=$env:APP_VER" "/DAppChannel=$env:APP_CHANNEL" "$PWD\setup.iss"
          $out = "$PWD\Output\SmartZonesPro_Setup_${env:APP_CHANNEL}_v$env:APP_VER.exe"
          if (-not (Test-Path $out)) {
            Write-Error 'Installer output missing'
            exit 1
          }
          Write-Host "Installer built: $out ($((Get-Item $out).Length) bytes)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: Output/SmartZonesPro_Setup_${{ env.APP_CHANNEL }}_*.exe
          if-no-files-found: error

      # ── 5. Публикация в Releases (только по тегу v*) ─────────────────────
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/exp-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/SmartZonesPro_Setup_${{ env.APP_CHANNEL }}_*.exe
          fail_on_unmatched_files: true
          prerelease: ${{ env.APP_CHANNEL == 'Experimental' }}
          name: Smart Zones Pro ${{ env.APP_CHANNEL }} ${{ env.APP_VER }}
