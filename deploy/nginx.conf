upstream lpzs_app {
    server lpzs:8000;
}

server {
    listen 80;
    server_name _;

    # Для боевого сервера с доменом раскомментируйте редирект на HTTPS
    # return 301 https://$host$request_uri;

    client_max_body_size 4m;

    # Проверка здоровья — без кеша
    location /api/ {
        proxy_pass       http://lpzs_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # Статика: спрайты и логотип кешируем надолго, разметку и скрипты — нет
    location ~* \.(webp|png|jpg|svg|ico|woff2)$ {
        proxy_pass http://lpzs_app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass       http://lpzs_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 1024;
}

